services:
  app:
    build: .
    container_name: telegram-smart-notes
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      # Volume Docker gestito automaticamente: i dati (DB + allegati) sopravvivono ai riavvii del container
      #- notes-data:/usr/src/app/data

      # In alternativa, per avere i dati in una cartella locale visibile sull'host,
      # commenta la riga sopra e usa questa (crea prima la cartella ./data):
      - ./data:/usr/src/app/data
