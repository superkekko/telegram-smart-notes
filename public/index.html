<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Assistant Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
        const tg = window.Telegram.WebApp;
        if (tg.colorScheme === 'dark') document.documentElement.classList.add('dark');
    </script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); }
        .dark .glass { background: rgba(15, 23, 42, 0.8); }
        body { transition: background-color 0.3s; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 min-h-screen font-sans text-slate-900 dark:text-slate-100">

    <div id="login-overlay" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-md hidden">
        <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl shadow-xl max-w-sm w-full mx-4 border border-slate-100 dark:border-slate-800 text-center">
            <div class="w-12 h-12 bg-indigo-100 dark:bg-indigo-950/50 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <i data-lucide="key-round" class="w-6 h-6"></i>
            </div>
            <h3 class="text-lg font-bold mb-2">Codice di Accesso Richiesto</h3>
            <p class="text-slate-500 dark:text-slate-400 text-sm mb-4">Inserisci il codice numerico a 6 cifre generato dal tuo bot Telegram con il comando /login.</p>
            <input type="text" id="auth-code-input" inputmode="numeric" pattern="[0-9]*" maxlength="6" class="w-full text-center text-2xl font-mono tracking-[0.5em] pl-[0.5em] py-3 bg-slate-100 dark:bg-slate-800 rounded-xl border-2 border-transparent focus:border-indigo-500 focus:outline-none mb-4" placeholder="000000">
            <button onclick="submitAuthCode()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition duration-200">
                Verifica Codice
            </button>
        </div>
    </div>

    <div class="max-w-md mx-auto px-4 pb-24 pt-6">
        
        <header class="flex items-center justify-between mb-6">
            <div class="flex items-center gap-3">
                <div id="user-avatar" class="w-10 h-10 bg-indigo-600 text-white font-black rounded-full flex items-center justify-center shadow-md uppercase">
                    U
                </div>
                <div>
                    <h1 id="user-name" class="font-black text-xl leading-none">Smart Assistant</h1>
                    <p class="text-[11px] text-slate-400 font-bold uppercase tracking-wider mt-1">Pannello Promemoria</p>
                </div>
            </div>
            <button onclick="toggleTheme()" class="p-2.5 bg-white dark:bg-slate-900 rounded-xl shadow-sm border border-slate-200/60 dark:border-slate-800/80 text-slate-600 dark:text-slate-400">
                <i id="theme-icon" data-lucide="moon" class="w-5 h-5"></i>
            </button>
        </header>

        <main>
            <div class="flex items-center justify-between mb-4 mt-2">
                <h2 class="font-black text-base uppercase tracking-wider text-slate-400 flex items-center gap-2">
                    <i data-lucide="bell" class="w-4 h-4"></i> Promemoria Attivi
                </h2>
                <span id="tasks-count" class="bg-indigo-100 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 text-xs font-black px-2.5 py-1 rounded-full">0</span>
            </div>

            <div id="tasks-list" class="space-y-3">
                <div class="text-center py-12 text-slate-400">
                    <div class="animate-spin w-6 h-6 border-2 border-indigo-500 border-t-transparent rounded-full mx-auto mb-2"></div>
                    <p class="text-xs">Sincronizzazione note...</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        let CHAT_ID = new URLSearchParams(window.location.search).get('chatId');
        let AUTH_TOKEN = localStorage.getItem(`auth_token_${CHAT_ID}`);

        document.addEventListener("DOMContentLoaded", async () => {
            lucide.createIcons();
            tg.ready();
            tg.expand();

            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                const user = tg.initDataUnsafe.user;
                if (user.first_name) {
                    document.getElementById('user-name').innerText = user.first_name;
                    document.getElementById('user-avatar').innerText = user.first_name.charAt(0);
                }
            }

            if (!AUTH_TOKEN && tg.initData) {
                await autoAuthenticate();
            }

            if (AUTH_TOKEN) {
                loadDashboardData();
            } else {
                document.getElementById('login-overlay').classList.remove('hidden');
            }
        });

        async function autoAuthenticate() {
            try {
                const response = await fetch('/api/auth/telegram', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData: tg.initData })
                });
                if (response.ok) {
                    const data = await response.json();
                    AUTH_TOKEN = data.token;
                    CHAT_ID = data.chatId;
                    localStorage.setItem(`auth_token_${CHAT_ID}`, AUTH_TOKEN);
                }
            } catch (e) {
                console.error("Autenticazione automatica TMA fallita:", e);
            }
        }

        function loadDashboardData() {
            loadTasks();
        }

        async function loadTasks() {
            try {
                const res = await fetch(`/api/tasks?chatId=${CHAT_ID}`, {
                    headers: { 'Authorization': `Bearer ${AUTH_TOKEN}` }
                });
                if (res.status === 403) return handleSessionExpired();
                
                const tasks = await res.json();
                document.getElementById('tasks-count').innerText = tasks.length;

                const listContainer = document.getElementById('tasks-list');
                
                if (tasks.length === 0) {
                    listContainer.innerHTML = `
                        <div class="text-center py-12 bg-white dark:bg-slate-900 rounded-2xl p-6 border border-slate-100 dark:border-slate-800/60 shadow-sm text-slate-400">
                            <i data-lucide="check-circle-2" class="w-8 h-8 text-emerald-500 mx-auto mb-2"></i>
                            <p class="font-bold text-sm text-slate-700 dark:text-slate-300">Ottimo lavoro!</p>
                            <p class="text-xs text-slate-400 mt-0.5">Nessun promemoria attivo in coda.</p>
                        </div>`;
                    lucide.createIcons();
                    return;
                }

                listContainer.innerHTML = tasks.map(task => {
                    const hasDeadline = !!task.deadline;
                    let deadlineHtml = '';
                    
                    if (hasDeadline) {
                        const d = new Date(task.deadline);
                        const formattedDate = d.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                        const isExpired = d < new Date();
                        
                        deadlineHtml = `
                            <div class="flex items-center gap-1 mt-2 text-xs font-bold ${isExpired ? 'text-rose-500 animate-pulse' : 'text-slate-400'}">
                                <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
                                <span>${formattedDate} ${task.recurrence ? `• Ricorrente (${task.recurrence})` : ''}</span>
                            </div>`;
                    }

                    return `
                        <div id="task-card-${task.id}" class="bg-white dark:bg-slate-900 rounded-2xl p-4 border border-slate-100 dark:border-slate-800/60 shadow-sm flex items-center justify-between gap-3 group transition-all duration-300">
                            <div class="flex-1 min-w-0">
                                <p class="text-sm font-semibold text-slate-800 dark:text-slate-200 break-words leading-snug">${task.task}</p>
                                ${deadlineHtml}
                                ${task.localPath ? `
                                <div class="inline-flex items-center gap-1 mt-1.5 px-2 py-0.5 bg-slate-100 dark:bg-slate-800 text-[10px] font-bold text-slate-500 rounded-md">
                                    <i data-lucide="paperclip" class="w-3 h-3"></i> Allegato presente
                                </div>` : ''}
                            </div>
                            
                            <div class="flex items-center gap-1.5 shrink-0">
                                <button onclick="completeTask(${task.id})" class="p-2 bg-emerald-50 hover:bg-emerald-100 dark:bg-emerald-950/40 dark:hover:bg-emerald-900/60 text-emerald-600 dark:text-emerald-400 rounded-xl transition duration-150" title="Contrassegna come Fatto">
                                    <i data-lucide="check" class="w-4 h-4"></i>
                                </button>
                                <button onclick="deleteTask(${task.id})" class="p-2 bg-rose-50 hover:bg-rose-100 dark:bg-rose-950/40 dark:hover:bg-rose-900/60 text-rose-600 dark:text-rose-400 rounded-xl transition duration-150" title="Elimina">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>`;
                }).join('');

                lucide.createIcons();
            } catch (e) {
                console.error("Errore caricamento note:", e);
                document.getElementById('tasks-list').innerHTML = '<p class="text-center py-10 text-red-500 font-bold text-sm">Impossibile caricare le note.</p>';
            }
        }

        // FUNZIONE PER COMPLETARE UN TASK
        async function completeTask(id) {
            if (!confirm("Vuoi contrassegnare questo promemoria come completato?")) return;
            
            try {
                const res = await fetch(`/api/tasks/${id}/complete?chatId=${CHAT_ID}`, {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${AUTH_TOKEN}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (res.ok) {
                    // Feedback visivo immediato: animazione di dissolvenza prima del ricaricamento completo
                    const card = document.getElementById(`task-card-${id}`);
                    card.classList.add('opacity-0', 'scale-95');
                    setTimeout(() => loadTasks(), 300);
                } else {
                    alert("Impossibile completare il task. Riprova.");
                }
            } catch (e) {
                console.error("Errore nel completamento del task:", e);
            }
        }

        // FUNZIONE PER ELIMINARE UN TASK
        async function deleteTask(id) {
            if (!confirm("Sei sicuro di voler eliminare definitivamente questo promemoria?")) return;
            
            try {
                const res = await fetch(`/api/tasks/${id}?chatId=${CHAT_ID}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${AUTH_TOKEN}` }
                });
                
                if (res.ok) {
                    const card = document.getElementById(`task-card-${id}`);
                    card.classList.add('opacity-0', 'translate-x-4');
                    setTimeout(() => loadTasks(), 300);
                } else {
                    alert("Impossibile eliminare il task. Riprova.");
                }
            } catch (e) {
                console.error("Errore nell'eliminazione del task:", e);
            }
        }

        // FUNZIONE PER VERIFICARE IL CODICE A 6 CIFRE (login manuale da browser esterno)
        async function submitAuthCode() {
            const codeInput = document.getElementById('auth-code-input');
            const code = codeInput.value.trim();

            if (!CHAT_ID) {
                alert("Chat ID mancante nell'URL. Apri il link fornito dal bot con il comando /login.");
                return;
            }
            if (code.length !== 6) {
                alert("Inserisci il codice a 6 cifre ricevuto da Telegram.");
                return;
            }

            try {
                const res = await fetch('/api/auth/code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chatId: CHAT_ID, code })
                });

                if (res.ok) {
                    const data = await res.json();
                    AUTH_TOKEN = data.token;
                    CHAT_ID = data.chatId;
                    localStorage.setItem(`auth_token_${CHAT_ID}`, AUTH_TOKEN);
                    document.getElementById('login-overlay').classList.add('hidden');
                    loadDashboardData();
                } else {
                    alert("Codice non valido o scaduto. Genera un nuovo codice con /login su Telegram.");
                }
            } catch (e) {
                console.error("Errore verifica codice:", e);
                alert("Errore di rete durante la verifica del codice.");
            }
        }

        function handleSessionExpired() {
            localStorage.removeItem(`auth_token_${CHAT_ID}`);
            AUTH_TOKEN = null;
            document.getElementById('login-overlay').classList.remove('hidden');
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            document.getElementById('theme-icon').setAttribute('data-lucide', isDark ? 'sun' : 'moon');
            lucide.createIcons();
        }
    </script>
</body>
</html>
