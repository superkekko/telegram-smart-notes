<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Assistant Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
        const tg = window.Telegram.WebApp;
        if (tg.colorScheme === 'dark') document.documentElement.classList.add('dark');
    </script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); }
        .dark .glass { background: rgba(15, 23, 42, 0.8); }
        body { transition: background-color 0.3s; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 min-h-screen font-sans text-slate-900 dark:text-slate-100">

    <div id="login-overlay" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-md hidden">
        <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl shadow-xl max-w-sm w-full mx-4 border border-slate-100 dark:border-slate-800 text-center">
            <div class="w-12 h-12 bg-indigo-100 dark:bg-indigo-950/50 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <i data-lucide="key-round" class="w-6 h-6"></i>
            </div>
            <h3 class="text-lg font-bold mb-2" data-i18n="web.login.title">Access code required</h3>
            <p class="text-slate-500 dark:text-slate-400 text-sm mb-4" data-i18n="web.login.text">Enter the 6-digit code generated by your Telegram bot with the /login command.</p>
            <input type="text" id="auth-code-input" inputmode="numeric" pattern="[0-9]*" maxlength="6" class="w-full text-center text-2xl font-mono tracking-[0.5em] pl-[0.5em] py-3 bg-slate-100 dark:bg-slate-800 rounded-xl border-2 border-transparent focus:border-indigo-500 focus:outline-none mb-4" placeholder="000000">
            <button onclick="submitAuthCode()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition duration-200" data-i18n="web.login.button">
                Verify code
            </button>
        </div>
    </div>

    <div class="max-w-md mx-auto px-4 pb-24 pt-6">

        <header class="flex items-center justify-between mb-6">
            <div class="flex items-center gap-3">
                <div id="user-avatar" class="w-10 h-10 bg-indigo-600 text-white font-black rounded-full flex items-center justify-center shadow-md uppercase">
                    U
                </div>
                <div>
                    <h1 id="user-name" class="font-black text-xl leading-none" data-i18n="web.default_user">Smart Assistant</h1>
                    <p class="text-[11px] text-slate-400 font-bold uppercase tracking-wider mt-1" data-i18n="web.subtitle">Reminders panel</p>
                </div>
            </div>
            <button onclick="toggleTheme()" class="p-2.5 bg-white dark:bg-slate-900 rounded-xl shadow-sm border border-slate-200/60 dark:border-slate-800/80 text-slate-600 dark:text-slate-400">
                <i id="theme-icon" data-lucide="moon" class="w-5 h-5"></i>
            </button>
        </header>

        <main>
            <div class="flex items-center justify-between mb-4 mt-2">
                <h2 class="font-black text-base uppercase tracking-wider text-slate-400 flex items-center gap-2">
                    <i data-lucide="bell" class="w-4 h-4"></i> <span data-i18n="web.tasks.title">Active reminders</span>
                </h2>
                <span id="tasks-count" class="bg-indigo-100 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 text-xs font-black px-2.5 py-1 rounded-full">0</span>
            </div>

            <div id="tasks-list" class="space-y-3">
                <div class="text-center py-12 text-slate-400">
                    <div class="animate-spin w-6 h-6 border-2 border-indigo-500 border-t-transparent rounded-full mx-auto mb-2"></div>
                    <p class="text-xs" data-i18n="web.tasks.syncing">Syncing notes...</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        let CHAT_ID = new URLSearchParams(window.location.search).get('chatId');
        let AUTH_TOKEN = localStorage.getItem(`auth_token_${CHAT_ID}`);

        // Filled in by loadLocale(): { language, locale, timezone, strings }
        let CONFIG = { language: 'en', locale: 'en-GB', timezone: 'UTC', strings: {} };

        // Translates a key with {placeholders}; falls back to the key itself
        function tr(key, params = {}) {
            const template = CONFIG.strings[key];
            if (template === undefined) return key;
            return template.replace(/\{(\w+)\}/g, (m, name) => params[name] !== undefined ? params[name] : m);
        }

        // Escapes text before inserting it into innerHTML (prevents XSS from note content)
        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        async function loadLocale() {
            try {
                const res = await fetch('/api/locale');
                if (res.ok) CONFIG = await res.json();
            } catch (e) {
                console.error("Unable to load locale, using defaults:", e);
            }
            document.documentElement.lang = CONFIG.language;
            applyTranslations();
        }

        function applyTranslations() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (CONFIG.strings[key] !== undefined) el.textContent = CONFIG.strings[key];
            });
            if (CONFIG.strings['web.title']) document.title = CONFIG.strings['web.title'];
        }

        // Current date/time in the server's configured timezone, as "YYYY-MM-DD HH:mm:ss".
        // Deadlines are stored in that timezone, so we compare strings in the same format.
        function nowInServerTimezone() {
            const parts = new Intl.DateTimeFormat('en-GB', {
                year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit', second: '2-digit',
                hour12: false, timeZone: CONFIG.timezone
            }).formatToParts(new Date());
            const d = {};
            parts.forEach(({ type, value }) => d[type] = value);
            const hour = d.hour === '24' ? '00' : d.hour;
            return `${d.year}-${d.month}-${d.day} ${hour}:${d.minute}:${d.second}`;
        }

        // Formats a stored deadline ("YYYY-MM-DD HH:mm:ss") using the configured locale,
        // without converting it to the browser's timezone.
        function formatDeadline(deadline) {
            const [datePart, timePart = '00:00:00'] = deadline.split(' ');
            const [y, m, d] = datePart.split('-').map(Number);
            const [hh, mm] = timePart.split(':').map(Number);
            return new Date(y, m - 1, d, hh, mm).toLocaleString(CONFIG.locale, {
                day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
            });
        }

        document.addEventListener("DOMContentLoaded", async () => {
            lucide.createIcons();
            tg.ready();
            tg.expand();

            await loadLocale();

            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                const user = tg.initDataUnsafe.user;
                if (user.first_name) {
                    document.getElementById('user-name').innerText = user.first_name;
                    document.getElementById('user-avatar').innerText = user.first_name.charAt(0);
                }
            }

            if (!AUTH_TOKEN && tg.initData) {
                await autoAuthenticate();
            }

            if (AUTH_TOKEN) {
                loadDashboardData();
            } else {
                document.getElementById('login-overlay').classList.remove('hidden');
            }
        });

        async function autoAuthenticate() {
            try {
                const response = await fetch('/api/auth/telegram', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData: tg.initData })
                });
                if (response.ok) {
                    const data = await response.json();
                    AUTH_TOKEN = data.token;
                    CHAT_ID = data.chatId;
                    localStorage.setItem(`auth_token_${CHAT_ID}`, AUTH_TOKEN);
                }
            } catch (e) {
                console.error("Automatic Mini App authentication failed:", e);
            }
        }

        function loadDashboardData() {
            loadTasks();
        }

        async function loadTasks() {
            try {
                const res = await fetch(`/api/tasks?chatId=${CHAT_ID}`, {
                    headers: { 'Authorization': `Bearer ${AUTH_TOKEN}` }
                });
                if (res.status === 403) return handleSessionExpired();

                const tasks = await res.json();
                document.getElementById('tasks-count').innerText = tasks.length;

                const listContainer = document.getElementById('tasks-list');

                if (tasks.length === 0) {
                    listContainer.innerHTML = `
                        <div class="text-center py-12 bg-white dark:bg-slate-900 rounded-2xl p-6 border border-slate-100 dark:border-slate-800/60 shadow-sm text-slate-400">
                            <i data-lucide="check-circle-2" class="w-8 h-8 text-emerald-500 mx-auto mb-2"></i>
                            <p class="font-bold text-sm text-slate-700 dark:text-slate-300">${escapeHtml(tr('web.tasks.empty_title'))}</p>
                            <p class="text-xs text-slate-400 mt-0.5">${escapeHtml(tr('web.tasks.empty_text'))}</p>
                        </div>`;
                    lucide.createIcons();
                    return;
                }

                const nowStr = nowInServerTimezone();

                listContainer.innerHTML = tasks.map(task => {
                    let deadlineHtml = '';

                    if (task.deadline) {
                        const isExpired = task.deadline < nowStr;
                        const recurrenceLabel = task.recurrence ? tr(`recurrence.${task.recurrence}`) : '';
                        const recurrenceHtml = task.recurrence
                            ? `• ${escapeHtml(tr('web.tasks.recurring', { label: recurrenceLabel }))}`
                            : '';

                        deadlineHtml = `
                            <div class="flex items-center gap-1 mt-2 text-xs font-bold ${isExpired ? 'text-rose-500 animate-pulse' : 'text-slate-400'}">
                                <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
                                <span>${escapeHtml(formatDeadline(task.deadline))} ${recurrenceHtml}</span>
                            </div>`;
                    }

                    return `
                        <div id="task-card-${task.id}" class="bg-white dark:bg-slate-900 rounded-2xl p-4 border border-slate-100 dark:border-slate-800/60 shadow-sm flex items-center justify-between gap-3 group transition-all duration-300">
                            <div class="flex-1 min-w-0">
                                <p class="text-sm font-semibold text-slate-800 dark:text-slate-200 break-words leading-snug">${escapeHtml(task.task)}</p>
                                ${deadlineHtml}
                                ${task.localPath ? `
                                <div class="inline-flex items-center gap-1 mt-1.5 px-2 py-0.5 bg-slate-100 dark:bg-slate-800 text-[10px] font-bold text-slate-500 rounded-md">
                                    <i data-lucide="paperclip" class="w-3 h-3"></i> ${escapeHtml(tr('web.tasks.has_attachment'))}
                                </div>` : ''}
                            </div>

                            <div class="flex items-center gap-1.5 shrink-0">
                                <button onclick="completeTask(${task.id})" class="p-2 bg-emerald-50 hover:bg-emerald-100 dark:bg-emerald-950/40 dark:hover:bg-emerald-900/60 text-emerald-600 dark:text-emerald-400 rounded-xl transition duration-150" title="${escapeHtml(tr('web.tasks.complete_title'))}">
                                    <i data-lucide="check" class="w-4 h-4"></i>
                                </button>
                                <button onclick="deleteTask(${task.id})" class="p-2 bg-rose-50 hover:bg-rose-100 dark:bg-rose-950/40 dark:hover:bg-rose-900/60 text-rose-600 dark:text-rose-400 rounded-xl transition duration-150" title="${escapeHtml(tr('web.tasks.delete_title'))}">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>`;
                }).join('');

                lucide.createIcons();
            } catch (e) {
                console.error("Error while loading notes:", e);
                document.getElementById('tasks-list').innerHTML =
                    `<p class="text-center py-10 text-red-500 font-bold text-sm">${escapeHtml(tr('web.tasks.load_error'))}</p>`;
            }
        }

        // MARK A TASK AS COMPLETED
        async function completeTask(id) {
            if (!confirm(tr('web.confirm.complete'))) return;

            try {
                const res = await fetch(`/api/tasks/${id}/complete?chatId=${CHAT_ID}`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${AUTH_TOKEN}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (res.ok) {
                    // Immediate visual feedback: fade out before reloading the list
                    const card = document.getElementById(`task-card-${id}`);
                    card.classList.add('opacity-0', 'scale-95');
                    setTimeout(() => loadTasks(), 300);
                } else {
                    alert(tr('web.error.complete'));
                }
            } catch (e) {
                console.error("Error while completing the task:", e);
            }
        }

        // DELETE A TASK
        async function deleteTask(id) {
            if (!confirm(tr('web.confirm.delete'))) return;

            try {
                const res = await fetch(`/api/tasks/${id}?chatId=${CHAT_ID}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${AUTH_TOKEN}` }
                });

                if (res.ok) {
                    const card = document.getElementById(`task-card-${id}`);
                    card.classList.add('opacity-0', 'translate-x-4');
                    setTimeout(() => loadTasks(), 300);
                } else {
                    alert(tr('web.error.delete'));
                }
            } catch (e) {
                console.error("Error while deleting the task:", e);
            }
        }

        // VERIFY THE 6-DIGIT CODE (manual login from an external browser)
        async function submitAuthCode() {
            const codeInput = document.getElementById('auth-code-input');
            const code = codeInput.value.trim();

            if (!CHAT_ID) {
                alert(tr('web.error.no_chat_id'));
                return;
            }
            if (code.length !== 6) {
                alert(tr('web.error.code_length'));
                return;
            }

            try {
                const res = await fetch('/api/auth/code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chatId: CHAT_ID, code })
                });

                if (res.ok) {
                    const data = await res.json();
                    AUTH_TOKEN = data.token;
                    CHAT_ID = data.chatId;
                    localStorage.setItem(`auth_token_${CHAT_ID}`, AUTH_TOKEN);
                    document.getElementById('login-overlay').classList.add('hidden');
                    loadDashboardData();
                } else {
                    alert(tr('web.error.code_invalid'));
                }
            } catch (e) {
                console.error("Error while verifying the code:", e);
                alert(tr('web.error.network'));
            }
        }

        function handleSessionExpired() {
            localStorage.removeItem(`auth_token_${CHAT_ID}`);
            AUTH_TOKEN = null;
            document.getElementById('login-overlay').classList.remove('hidden');
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            document.getElementById('theme-icon').setAttribute('data-lucide', isDark ? 'sun' : 'moon');
            lucide.createIcons();
        }
    </script>
</body>
</html>
